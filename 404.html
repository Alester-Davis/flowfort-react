<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FlowFort</title>
    <script>
      // GitHub Pages SPA redirect: store the path and redirect to root
      var path = window.location.pathname.replace('/flowfort-react', '');
      var search = window.location.search;
      var hash = window.location.hash;
      var redirect = '/flowfort-react/?p=' + encodeURIComponent(path + search) + hash;
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
